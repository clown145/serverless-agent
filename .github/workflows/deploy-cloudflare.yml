name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ${{ vars.WORKER_NAME || 'serverless-agent' }}
      DEFAULT_AGENT_ID: ${{ vars.DEFAULT_AGENT_ID || 'default' }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'mock' }}
      AGENT_TIMEZONE: ${{ vars.AGENT_TIMEZONE || 'Asia/Shanghai' }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || vars.WORKER_NAME || 'serverless-agent' }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_TITLE: ${{ vars.KV_NAMESPACE_TITLE || vars.WORKER_NAME || 'serverless-agent' }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || vars.WORKER_NAME || 'serverless-agent' }}
      R2_ATTACHMENT_RETENTION_DAYS: ${{ vars.R2_ATTACHMENT_RETENTION_DAYS || '30' }}
      OBJECT_STORAGE_BACKEND: ${{ vars.OBJECT_STORAGE_BACKEND || 'r2' }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE || 'false' }}
      QUEUE_NAME: ${{ vars.QUEUE_NAME || 'serverless-agent-events' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INTERNAL_ADMIN_TOKEN: ${{ secrets.INTERNAL_ADMIN_TOKEN }}
      AGENT_MASTER_KEY: ${{ secrets.AGENT_MASTER_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      GENERATED_CONFIG: wrangler.generated.toml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is required."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi

          if [ -z "$INTERNAL_ADMIN_TOKEN" ]; then
            echo "INTERNAL_ADMIN_TOKEN is required for deployed admin routes."
            exit 1
          fi

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build prompts
        run: npm run prompts:build

      - name: Build Admin WebUI
        run: npm run admin:build

      - name: Ensure Cloudflare resources
        run: |
          set -euo pipefail

          if [ -z "$D1_DATABASE_ID" ]; then
            DB_LIST=$(npx wrangler d1 list --json)
            D1_DATABASE_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$D1_DATABASE_NAME\") | .uuid" | head -n 1)

            if [ -z "$D1_DATABASE_ID" ]; then
              npx wrangler d1 create "$D1_DATABASE_NAME"
              DB_LIST=$(npx wrangler d1 list --json)
              D1_DATABASE_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$D1_DATABASE_NAME\") | .uuid" | head -n 1)
            fi
          fi

          if [ -z "$D1_DATABASE_ID" ]; then
            echo "Failed to resolve D1 database id."
            exit 1
          fi

          if [ -z "$KV_NAMESPACE_ID" ]; then
            KV_LIST=$(npx wrangler kv namespace list)
            KV_NAMESPACE_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$KV_NAMESPACE_TITLE\") | .id" | head -n 1)

            if [ -z "$KV_NAMESPACE_ID" ]; then
              npx wrangler kv namespace create "$KV_NAMESPACE_TITLE"
              KV_LIST=$(npx wrangler kv namespace list)
              KV_NAMESPACE_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$KV_NAMESPACE_TITLE\") | .id" | head -n 1)
            fi
          fi

          if [ -z "$KV_NAMESPACE_ID" ]; then
            echo "Failed to resolve KV namespace id."
            exit 1
          fi

          case "$OBJECT_STORAGE_BACKEND" in
            r2|s3|d1_lite) ;;
            *)
              echo "OBJECT_STORAGE_BACKEND must be one of: r2, s3, d1_lite."
              exit 1
              ;;
          esac

          if [ "$OBJECT_STORAGE_BACKEND" = "r2" ]; then
            R2_BUCKET_EXISTS="false"
            if R2_BUCKET_LIST=$(npx wrangler r2 bucket list --json); then
              if echo "$R2_BUCKET_LIST" | jq -e ".[] | select(.name == \"$R2_BUCKET_NAME\")" >/dev/null; then
                R2_BUCKET_EXISTS="true"
              fi
            else
              echo "R2 bucket list failed; falling back to OBJECT_STORAGE_BACKEND=d1_lite."
              OBJECT_STORAGE_BACKEND="d1_lite"
            fi

            if [ "$OBJECT_STORAGE_BACKEND" = "r2" ] && [ "$R2_BUCKET_EXISTS" != "true" ]; then
              if ! npx wrangler r2 bucket create "$R2_BUCKET_NAME"; then
                echo "R2 bucket create failed; falling back to OBJECT_STORAGE_BACKEND=d1_lite."
                OBJECT_STORAGE_BACKEND="d1_lite"
              fi
            fi
          fi

          if [ "$OBJECT_STORAGE_BACKEND" = "r2" ]; then
            if ! [[ "$R2_ATTACHMENT_RETENTION_DAYS" =~ ^[0-9]+$ ]]; then
              echo "R2_ATTACHMENT_RETENTION_DAYS must be a non-negative integer."
              exit 1
            fi

            npx wrangler r2 bucket lifecycle remove "$R2_BUCKET_NAME" \
              --name expire-agent-attachments || true

            if [ "$R2_ATTACHMENT_RETENTION_DAYS" != "0" ]; then
              npx wrangler r2 bucket lifecycle add "$R2_BUCKET_NAME" \
                expire-agent-attachments \
                attachments/ \
                --expire-days "$R2_ATTACHMENT_RETENTION_DAYS" \
                --force
            fi
          fi

          if [ "$OBJECT_STORAGE_BACKEND" = "s3" ]; then
            if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ] || [ -z "$S3_ACCESS_KEY_ID" ] || [ -z "$S3_SECRET_ACCESS_KEY" ]; then
              echo "S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, and S3_SECRET_ACCESS_KEY are required for OBJECT_STORAGE_BACKEND=s3."
              exit 1
            fi
          fi

          QUEUE_EXISTS="false"
          if QUEUE_LIST=$(npx wrangler queues list --json); then
            if echo "$QUEUE_LIST" | jq -e ".[] | select(.queue_name == \"$QUEUE_NAME\" or .name == \"$QUEUE_NAME\")" >/dev/null; then
              QUEUE_EXISTS="true"
            fi
          else
            echo "Queue list failed; falling back to create-if-needed."
          fi

          if [ "$QUEUE_EXISTS" != "true" ]; then
            npx wrangler queues create "$QUEUE_NAME" || true
          fi

          echo "D1_DATABASE_ID=$D1_DATABASE_ID" >> "$GITHUB_ENV"
          echo "KV_NAMESPACE_ID=$KV_NAMESPACE_ID" >> "$GITHUB_ENV"
          echo "OBJECT_STORAGE_BACKEND=$OBJECT_STORAGE_BACKEND" >> "$GITHUB_ENV"

      - name: Generate Wrangler config
        run: |
          set -euo pipefail

          cp wrangler.github.toml "$GENERATED_CONFIG"

          replace() {
            key="$1"
            value="$2"
            sed -i "s|\\\${$key}|$value|g" "$GENERATED_CONFIG"
          }

          replace WORKER_NAME "$WORKER_NAME"
          replace DEFAULT_AGENT_ID "$DEFAULT_AGENT_ID"
          replace MODEL_PROVIDER "$MODEL_PROVIDER"
          replace AGENT_TIMEZONE "$AGENT_TIMEZONE"
          replace OBJECT_STORAGE_BACKEND "$OBJECT_STORAGE_BACKEND"
          replace S3_ENDPOINT "$S3_ENDPOINT"
          replace S3_BUCKET "$S3_BUCKET"
          replace S3_REGION "$S3_REGION"
          replace S3_FORCE_PATH_STYLE "$S3_FORCE_PATH_STYLE"
          replace D1_DATABASE_NAME "$D1_DATABASE_NAME"
          replace D1_DATABASE_ID "$D1_DATABASE_ID"
          replace KV_NAMESPACE_ID "$KV_NAMESPACE_ID"
          replace R2_BUCKET_NAME "$R2_BUCKET_NAME"
          replace QUEUE_NAME "$QUEUE_NAME"

          replace R2_BUCKET_BINDING ""

          if [ "$OBJECT_STORAGE_BACKEND" = "r2" ]; then
            printf '\n[[r2_buckets]]\nbinding = "AGENT_BUCKET"\nbucket_name = "%s"\n' "$R2_BUCKET_NAME" >> "$GENERATED_CONFIG"
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config "$GENERATED_CONFIG"

      - name: Deploy Worker
        run: npx wrangler deploy --config "$GENERATED_CONFIG"

      - name: Upload Worker secrets
        run: |
          set -euo pipefail

          put_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf "%s" "$value" | npx wrangler secret put "$name" --config "$GENERATED_CONFIG"
            fi
          }

          put_secret INTERNAL_ADMIN_TOKEN "$INTERNAL_ADMIN_TOKEN"
          put_secret AGENT_MASTER_KEY "$AGENT_MASTER_KEY"
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret TAVILY_API_KEY "$TAVILY_API_KEY"
          put_secret S3_ACCESS_KEY_ID "$S3_ACCESS_KEY_ID"
          put_secret S3_SECRET_ACCESS_KEY "$S3_SECRET_ACCESS_KEY"
          put_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"

      - name: Redeploy Worker after secret updates
        run: npx wrangler deploy --config "$GENERATED_CONFIG"
