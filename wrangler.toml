name = "serverless-agent"
main = "src/worker/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./apps/admin-web/dist"
binding = "ASSETS"
run_worker_first = [
  "/admin/*",
  "/webhooks/*",
  "/health",
  "/ui",
  "/ui/*",
  "/cdn-cgi/*"
]

[vars]
DEFAULT_AGENT_ID = "default"
MODEL_PROVIDER = "mock"
AGENT_TIMEZONE = "Asia/Shanghai"
OBJECT_STORAGE_BACKEND = "r2"

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "AGENT_OBJECT"
class_name = "AgentDurableObject"

[[durable_objects.bindings]]
name = "QQ_OFFICIAL_GATEWAY"
class_name = "QQOfficialGatewayDurableObject"

[[durable_objects.bindings]]
name = "WEIXIN_OC_GATEWAY"
class_name = "WeixinOcGatewayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["QQOfficialGatewayDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WeixinOcGatewayDurableObject"]

[[queues.producers]]
binding = "AGENT_QUEUE"
queue = "serverless-agent-events"

[[queues.consumers]]
queue = "serverless-agent-events"
max_batch_size = 10
max_batch_timeout = 5

[[r2_buckets]]
binding = "AGENT_BUCKET"
bucket_name = "serverless-agent"

[[d1_databases]]
binding = "AGENT_DB"
database_name = "serverless-agent"
database_id = "replace-with-d1-database-id"
migrations_dir = "infra/cloudflare/migrations"

[[kv_namespaces]]
binding = "AGENT_KV"
id = "replace-with-kv-namespace-id"
